<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theta Gang Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0e14; color: #c9d1d9; padding: 20px; line-height: 1.5; }
        .container { max-width: 820px; margin: 0 auto; }
        h1 { font-size: 26px; margin-bottom: 24px; background: linear-gradient(135deg, #58a6ff, #bc8cff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Lock screen */
        #lock { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60vh; gap: 12px; }
        #lock h1 { -webkit-text-fill-color: transparent; }
        #lock input { background: #12171f; border: 2px solid #1e2733; border-radius: 8px; color: #c9d1d9; font-size: 18px; padding: 12px 20px; width: 220px; text-align: center; outline: none; transition: border-color 0.2s; }
        #lock input:focus { border-color: #58a6ff; }
        #lock button { background: #58a6ff; color: white; border: none; padding: 12px 28px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; transition: opacity 0.2s; }
        #lock button:hover { opacity: 0.85; }
        #lock .error { color: #f85149; font-size: 13px; height: 18px; }

        /* Dashboard */
        #dashboard { display: none; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .updated-at { font-size: 11px; color: #6e7681; text-align: right; margin-bottom: 8px; }

        /* Stats grid */
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 28px; }
        .stat-card { background: #12171f; border: 1px solid #1e2733; border-radius: 12px; padding: 16px; }
        .stat-card .label { color: #6e7681; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        .stat-card .value { font-size: 22px; font-weight: 700; }
        .stat-card .sub { font-size: 12px; color: #6e7681; margin-top: 4px; }
        .green { color: #3fb950; }
        .blue { color: #58a6ff; }
        .cyan { color: #39d2c0; }
        .purple { color: #bc8cff; }
        .yellow { color: #d29922; }

        /* Section */
        .section { margin-bottom: 28px; }
        .section h2 { font-size: 12px; color: #6e7681; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #1e2733; }

        /* Position cards */
        .pos-card { background: #12171f; border: 1px solid #1e2733; border-left: 4px solid #444; border-radius: 0 8px 8px 0; padding: 14px 16px; margin-bottom: 10px; }
        .pos-card.CC { border-left-color: #39d2c0; }
        .pos-card.CSP { border-left-color: #bc8cff; }
        .pos-header { display: flex; justify-content: space-between; align-items: center; }
        .pos-ticker { font-size: 15px; font-weight: 700; }
        .pos-badge { font-size: 10px; padding: 2px 7px; border-radius: 99px; font-weight: 700; margin-left: 6px; }
        .pos-badge.CC { background: rgba(57,210,192,0.15); color: #39d2c0; }
        .pos-badge.CSP { background: rgba(188,140,255,0.15); color: #bc8cff; }
        .pos-premium { font-size: 15px; font-weight: 700; color: #3fb950; }
        .pos-meta { display: flex; gap: 16px; font-size: 12px; color: #6e7681; margin-top: 6px; }
        .dte-hot { color: #f85149; }
        .dte-warm { color: #d29922; }
        .empty-note { color: #6e7681; font-size: 13px; font-style: italic; }
        .buffer-safe { color: #3fb950; }
        .buffer-warn { color: #d29922; }
        .buffer-danger { color: #f85149; }
        .pos-price-row { display: flex; align-items: center; gap: 12px; font-size: 12px; color: #6e7681; margin-top: 6px; }
        .buffer-bar { flex: 1; max-width: 100px; height: 3px; background: #1e2733; border-radius: 2px; overflow: hidden; }
        .buffer-bar-fill { height: 100%; border-radius: 2px; }
        .pos-spark-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
        .buffer-spark { flex-shrink: 0; display: block; }
        .pos-spark-label { font-size: 11px; color: #6e7681; }
        .market-data-ts { font-size: 10px; color: #484f58; text-align: right; margin-bottom: 8px; }
        .expiry-group { margin-bottom: 16px; }
        .expiry-group-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 14px; margin-bottom: 10px; background: #0d1117; border: 1px solid #1e2733; border-radius: 8px; color: #c9d1d9; }
        .expiry-group-title { font-size: 13px; font-weight: 700; color: #58a6ff; }
        .expiry-group-meta { display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: 8px; font-size: 12px; color: #6e7681; }
        .expiry-group-meta strong { color: #d29922; font-weight: 700; }

        /* Attention strip */
        .attention-strip { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
        .attention-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 8px; font-size: 13px; border: 1px solid; }
        .attention-row .att-icon { font-size: 13px; flex-shrink: 0; }
        .attention-row strong { font-weight: 700; }
        .attention-danger { background: rgba(248,81,73,0.12); border-color: rgba(248,81,73,0.4); color: #f85149; }
        .attention-warn { background: rgba(210,153,34,0.12); border-color: rgba(210,153,34,0.4); color: #d29922; }
        .attention-nodata { background: rgba(110,118,129,0.12); border-color: rgba(110,118,129,0.45); color: #8b949e; }
        .attention-ok { background: rgba(63,185,80,0.10); border-color: rgba(63,185,80,0.35); color: #3fb950; }

        /* 到期预结算（周五 ITM/OTM 预判, weekly-close 草稿）——复用 .attention-row/.idle-table/.trade-status */
        .presettle-overdue { margin-bottom: 12px; font-weight: 700; }
        .presettle-summary { font-size: 12px; color: #8b949e; margin-bottom: 12px; }
        .presettle-doubt { font-size: 10px; color: #d29922; margin-top: 3px; }

        /* Annualized yield + CC cost-line flags */
        .pos-annual { color: #58a6ff; }
        .cc-flag { font-size: 10px; padding: 2px 7px; border-radius: 99px; font-weight: 700; margin-left: 6px; }
        .cc-flag-repair { background: rgba(210,153,34,0.15); color: #d29922; }
        .cc-flag-t3 { background: rgba(248,81,73,0.15); color: #f85149; }

        /* Idle positions table */
        .idle-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .idle-table th { text-align: left; color: #6e7681; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; padding: 6px 12px; border-bottom: 1px solid #1e2733; }
        .idle-table td { padding: 9px 12px; border-bottom: 1px solid #12171f; }
        .idle-table tr:hover td { background: #12171f; }
        .idle-table .ticker-cell { font-weight: 700; color: #c9d1d9; }
        .cc-yes { color: #3fb950; font-size: 12px; }
        .cc-no { color: #6e7681; font-size: 12px; }
        .idle-table-wrap { overflow-x: auto; }
        .pnl-pos { color: #3fb950; }
        .pnl-neg { color: #f85149; }

        /* Volatility health check (RV vs IV floor) */
        .vol-note { color: #6e7681; font-size: 12px; line-height: 1.55; margin: -4px 0 14px; }
        .vol-status { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 700; white-space: nowrap; }
        .vol-quiet { background: rgba(210,153,34,0.15); color: #d29922; }   /* 变安静? */
        .vol-hot { background: rgba(63,185,80,0.14); color: #3fb950; }      /* 够热 */
        .vol-low { background: rgba(110,118,129,0.18); color: #c9d1d9; }    /* 偏低 */
        .vol-na { color: #6e7681; }
        .vol-trend-up { color: #d29922; }    /* 升温 */
        .vol-trend-down { color: #58a6ff; }  /* 降温 */
        .vol-trend-flat { color: #6e7681; }  /* 持平 */

        /* Chart */
        .chart-wrap { background: #12171f; border: 1px solid #1e2733; border-radius: 12px; padding: 20px; }

        /* Trade history */
        .week-group { margin-bottom: 10px; }
        .week-header { display: flex; justify-content: space-between; align-items: center; padding: 11px 16px; background: #12171f; border: 1px solid #1e2733; border-radius: 8px; cursor: pointer; transition: background 0.15s; user-select: none; }
        .week-header:hover { background: #161b22; }
        .week-left { display: flex; align-items: center; gap: 10px; }
        .week-arrow { font-size: 11px; color: #6e7681; transition: transform 0.2s; }
        .week-arrow.open { transform: rotate(90deg); }
        .week-title { font-size: 14px; font-weight: 700; color: #58a6ff; }
        .week-count { font-size: 11px; color: #6e7681; }
        .week-total { font-size: 15px; font-weight: 700; color: #3fb950; }
        .week-total.negative { color: #f85149; }
        .week-trades { display: none; padding: 6px 0 4px 0; }
        .week-trades.open { display: block; }
        .trade-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; font-size: 13px; border-radius: 6px; }
        .trade-row:hover { background: #12171f; }
        .trade-left { display: flex; flex-direction: column; gap: 2px; }
        .trade-ticker { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-weight: 700; }
        .trade-detail { font-size: 11px; color: #6e7681; }
        .trade-premium { font-weight: 700; }
        .trade-status { font-size: 10px; padding: 1px 6px; border-radius: 999px; font-weight: 700; }
        .trade-status-positive { background: rgba(63,185,80,0.14); color: #3fb950; }
        .trade-status-warning { background: rgba(217,130,43,0.15); color: #d29922; }
        .trade-status-accent { background: rgba(88,166,255,0.16); color: #58a6ff; }
        .trade-status-gold { background: rgba(188,140,255,0.15); color: #bc8cff; }
        .trade-status-danger { background: rgba(248,81,73,0.15); color: #f85149; }
        .trade-status-muted { background: rgba(110,118,129,0.18); color: #c9d1d9; }

        @media (max-width: 480px) {
            body { padding: 14px; }
            .stats { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
            .stat-card { padding: 14px; }
            .stat-card .value { font-size: 19px; }
            .pos-header,
            .expiry-group-header { align-items: flex-start; flex-direction: column; }
            .pos-meta,
            .pos-price-row { flex-wrap: wrap; gap: 8px 12px; }
            .expiry-group-meta { justify-content: flex-start; }
            .attention-row { align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Lock screen -->
        <div id="lock">
            <h1>Theta Gang</h1>
            <input type="password" id="pwd" placeholder="密码" autocomplete="current-password">
            <button onclick="unlock()">解锁</button>
            <div class="error" id="err"></div>
        </div>

        <!-- Dashboard -->
        <div id="dashboard">
            <div class="updated-at" id="updated-at"></div>
            <h1>Theta Gang 战况</h1>

            <!-- Stats -->
            <div class="stats" id="stats"></div>

            <!-- Attention strip -->
            <div id="attention-strip"></div>

            <!-- 到期预结算（周五 ITM/OTM 预判, weekly-close 草稿；依收盘价预判、非结算，台账仍是唯一依据） -->
            <div class="section" id="presettle-section">
                <h2>到期预结算</h2>
                <div class="vol-note">依收盘价的大概率预判，非最终结算：临界(pin)与盘后波动可能翻转，OTM 一线之隔仍可能被 assign。这是 weekly-close 的草稿，台账仍是唯一依据、需手动入账。</div>
                <div id="presettle-body"></div>
            </div>

            <!-- Open Positions -->
            <div class="section">
                <h2>在途持仓</h2>
                <div id="open-positions"></div>
            </div>

            <!-- Idle Stock Holdings -->
            <div class="section" id="idle-section">
                <h2>持仓股票</h2>
                <div id="idle-positions"></div>
            </div>

            <!-- Volatility health check (RV vs IV floor) -->
            <div class="section" id="volcheck-section">
                <h2>波动率体检</h2>
                <div class="vol-note">RV=已实现波动(标的历史,后视)；IV 底=隐含波动阈值。IV 通常高于 RV，RV 低于门槛只提示复核、非自动降档。</div>
                <div id="volcheck-body"></div>
            </div>

            <!-- Weekly Income Chart -->
            <div class="section">
                <h2>每周权利金</h2>
                <div class="chart-wrap">
                    <canvas id="weekly-chart" height="180"></canvas>
                </div>
            </div>

            <!-- Trade History -->
            <div class="section">
                <h2>交易记录</h2>
                <div id="trade-history"></div>
            </div>
        </div>
    </div>

        // Decrypt and render
        async function unlock() {
            const pwd = document.getElementById('pwd').value;
            const errEl = document.getElementById('err');
            errEl.textContent = '';
            try {
                const enc = new TextEncoder();
                const km = await crypto.subtle.importKey('raw', enc.encode(pwd), { name: 'PBKDF2' }, false, ['deriveKey']);
                const key = await crypto.subtle.deriveKey(
                    { name: 'PBKDF2', salt: b64(ENC.salt), iterations: 100000, hash: 'SHA-256' },
                    km,
                    { name: 'AES-GCM', length: 256 },
                    false,
                    ['decrypt']
                );
                const ct = b64(ENC.data), tag = b64(ENC.tag);
                const combined = new Uint8Array(ct.length + tag.length);
                combined.set(ct); combined.set(tag, ct.length);
                const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(ENC.iv) }, key, combined);
                const data = JSON.parse(new TextDecoder().decode(decrypted));

                document.getElementById('lock').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                renderDashboard(data);
            } catch (e) {
                errEl.textContent = '密码错误';
            }
        }

        function b64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }

        document.getElementById('pwd').addEventListener('keypress', e => { if (e.key === 'Enter') unlock(); });

        function deriveFallbackLifecycle(trade) {
            const result = trade.result || '';
            if (/归零/.test(result)) return { label: 'Expire Worthless', tone: 'positive' };
            if (/止盈/.test(result)) return { label: 'Take Profit', tone: 'gold' };
            if (/止损|净亏损|被动平仓/.test(result)) return { label: 'Stop Loss', tone: 'danger' };
            if (/到期/.test(result)) return { label: 'Expired', tone: 'muted' };
            if (trade.assigned) {
                return trade.type === 'CC'
                    ? { label: 'Call Away', tone: 'warning' }
                    : { label: 'Receive Shares', tone: 'accent' };
            }
            return null;
        }

        function getLifecycleBadge(trade) {
            const lifecycle = trade.lifecycle || '';
            const label = trade.lifecycleLabel || (deriveFallbackLifecycle(trade) || {}).label;
            if (!label) return '';

            let tone = 'muted';
            if (lifecycle === 'expire-worthless') tone = 'positive';
            else if (lifecycle === 'call-away') tone = 'warning';
            else if (lifecycle === 'receive-shares') tone = 'accent';
            else if (lifecycle === 'take-profit') tone = 'gold';
            else if (lifecycle === 'stop-loss') tone = 'danger';
            else if (lifecycle === 'expired' || lifecycle === 'pending') tone = 'muted';
            else tone = (deriveFallbackLifecycle(trade) || {}).tone || 'muted';

            return `<span class="trade-status trade-status-${tone}">${label}</span>`;
        }

        function getContractCount(position) {
            return Number.isFinite(position.contracts) && position.contracts > 0 ? position.contracts : 1;
        }

        function getCspNotional(position) {
            if (position.type !== 'CSP' || !Number.isFinite(position.strike)) return 0;
            return position.strike * 100 * getContractCount(position);
        }

        function formatDollar(value) {
            return '$' + Math.round(value).toLocaleString();
        }

        function formatExpiryMd(expiry) {
            const parts = String(expiry || '').split('-');
            if (parts.length !== 3) return expiry || '日期异常';
            return `${Number(parts[1])}/${Number(parts[2])}`;
        }

        // 手绘 buffer 轨迹 sparkline：X 等距、Y=bufferPct，含强制 bufferPct=0 水平零线（ITM 边界）——
        // 零线是这个图的全部意义，看折线是否在逼近/穿越零。折线按末点状态着色（≥5 绿 / 0–5 橙 / <0 红），
        // Y 值域始终含 0 并把点 clamp 进视图。仅 ≥2 点渲染（新仓位不留破图）。不为每张卡 new Chart 实例。
        function renderBufferSparkline(history) {
            if (!Array.isArray(history) || history.length < 2) return '';
            const W = 88, H = 24, padX = 3, padY = 3;
            const vals = history.map(pt => pt.bufferPct);
            let lo = Math.min(0, ...vals);
            let hi = Math.max(0, ...vals);
            if (hi === lo) { hi += 1; lo -= 1; } // 退化保护：全相等时给一点跨度
            const x = i => padX + (W - 2 * padX) * (i / (history.length - 1));
            const y = v => {
                const c = Math.max(lo, Math.min(hi, v));
                return padY + (H - 2 * padY) * (1 - (c - lo) / (hi - lo));
            };
            const last = vals[vals.length - 1];
            const color = last >= 5 ? '#3fb950' : last >= 0 ? '#d29922' : '#f85149';
            const zeroY = y(0).toFixed(1);
            const pts = history.map((pt, i) => `${x(i).toFixed(1)},${y(pt.bufferPct).toFixed(1)}`).join(' ');
            const lx = x(history.length - 1).toFixed(1), ly = y(last).toFixed(1);
            return `<svg class="buffer-spark" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">`
                + `<line x1="${padX}" y1="${zeroY}" x2="${W - padX}" y2="${zeroY}" stroke="#484f58" stroke-width="0.75" stroke-dasharray="2 2"/>`
                + `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round"/>`
                + `<circle cx="${lx}" cy="${ly}" r="1.6" fill="${color}"/></svg>`;
        }

        // 轨迹行 = sparkline + 首→末文本「轨迹 +8.1% → +4.9%」（history 已在 data-loader 裁剪到 openDate 之后）
        function renderBufferTrajectory(history) {
            const svg = renderBufferSparkline(history);
            if (!svg) return '';
            const fmt = v => (v >= 0 ? '+' : '') + v.toFixed(1) + '%';
            const first = history[0].bufferPct, last = history[history.length - 1].bufferPct;
            return `<div class="pos-spark-row">${svg}<span class="pos-spark-label">轨迹 ${fmt(first)} → ${fmt(last)}</span></div>`;
        }

        // 用字符串日期（YYYY-MM-DD）按 UTC 零点算日历日差，避免本地时区偏移；下限 1 天
        function daysBetween(startYmd, endYmd) {
            const s = Date.parse(startYmd + 'T00:00:00Z');
            const e = Date.parse(endYmd + 'T00:00:00Z');
            if (Number.isNaN(s) || Number.isNaN(e)) return null;
            return Math.max(1, Math.round((e - s) / 86400000));
        }

        // 年化 = 权利金 / 占用资本 / 原始期限 × 365。用开仓日→到期日的原始期限，
        // 不用剩余 DTE（否则临期会虚高）。openDate 缺失则返回 null（不显示，不猜）。
        function getAnnualizedYieldPct(p, costBasisByTicker) {
            if (!p.openDate || !p.expiry) return null;
            const term = daysBetween(p.openDate, p.expiry);
            if (term == null) return null;
            let capital;
            if (p.type === 'CSP') {
                capital = p.strike * 100 * getContractCount(p);
            } else {
                const cost = costBasisByTicker[p.ticker];
                capital = (typeof cost === 'number' && cost > 0 ? cost : p.strike) * 100 * getContractCount(p);
            }
            if (!(capital > 0) || !(p.premium > 0)) return null;
            return (p.premium / capital) / term * 365 * 100;
        }

        // 履约风险告警条：把 buffer 从被动小字提升为主动分档提示。
        // 三态必须齐全——「无数据」和危险态同等重要，刚开的仓最容易落在无数据。
        function renderAttentionStrip(open, priceMissing, priceStale) {
            const el = document.getElementById('attention-strip');
            if (!open || open.length === 0) { el.className = ''; el.innerHTML = ''; return; }

            const danger = [];
            const warn = [];
            const noData = [];
            for (const p of open) {
                const priced = typeof p.lastPrice === 'number' && typeof p.bufferPct === 'number';
                if (!priced) { noData.push(p); continue; }
                // CC ITM 不进告警条：被 call away 是策略接受的结局，不是风险事件
                if (p.type !== 'CSP') continue;
                if (p.bufferPct < 0) {
                    danger.push({ p, deep: (p.strike - p.lastPrice) > 5 });
                } else if (p.bufferPct < 5) {
                    warn.push(p);
                }
            }

            const rows = [];
            for (const { p, deep } of danger) {
                const depthNote = deep
                    ? ` · <strong>深度 ITM $${(p.strike - p.lastPrice).toFixed(1)} · §11 立即重估</strong>`
                    : '';
                rows.push(`<div class="attention-row attention-danger"><span class="att-icon">⚠</span><span>${p.ticker} $${p.strike} CSP 已 ITM ${p.bufferPct.toFixed(1)}%${depthNote}</span></div>`);
            }
            if (warn.length) {
                const list = warn.map(p => `${p.ticker} +${p.bufferPct.toFixed(1)}%`).join('、');
                rows.push(`<div class="attention-row attention-warn"><span class="att-icon">◔</span><span>buffer 不足 5%：${list}</span></div>`);
            }
            if (noData.length) {
                // Part C：区分「抓取失败」（ticker 进了 missing）与「真实缺口」，让抓取自检真正被看见。
                const missingSet = new Set(priceMissing || []);
                const failed = noData.filter(p => missingSet.has(p.ticker)).map(p => p.ticker);
                const reason = failed.length
                    ? `（因抓取失败：${failed.join('、')}）`
                    : `（${noData.map(p => p.ticker).join('、')}）`;
                rows.push(`<div class="attention-row attention-nodata"><span class="att-icon">○</span><span>${noData.length} 张持仓无价格数据${reason}</span></div>`);
            }
            // 价格滞后（拿到价但 date 落后于 latestDate）——独立提示，别人更新了它没更新
            if (Array.isArray(priceStale) && priceStale.length) {
                rows.push(`<div class="attention-row attention-nodata"><span class="att-icon">○</span><span>价格滞后：${priceStale.join('、')}</span></div>`);
            }
            if (rows.length === 0) {
                rows.push(`<div class="attention-row attention-ok"><span class="att-icon">✓</span><span>全部在途 CSP buffer ≥ 5%，价格齐全</span></div>`);
            }

            el.className = 'attention-strip';
            el.innerHTML = rows.join('');
        }

        // 波动率体检：RV（已实现，后视）对 IV 底（隐含阈值，前视）的廉价降温预警。
        // RV≠IV——低于门槛只提示复核、非自动降档（见 section 下 advisory 小字）。
        // volCheck 缺失/空 → 整段隐藏（degrade，可先于上游 Part A 上线不报错）。
        function renderVolCheck(volCheck) {
            const section = document.getElementById('volcheck-section');
            const body = document.getElementById('volcheck-body');
            const entries = volCheck && typeof volCheck === 'object' ? Object.entries(volCheck) : [];
            if (entries.length === 0) {
                section.style.display = 'none';
                return;
            }
            section.style.display = '';

            const pct = v => (typeof v === 'number' ? Math.round(v * 100) + '%' : '—');

            // 状态：quiet→变安静?橙；rv>=minIv→够热绿；minIv*0.8<=rv<minIv→偏低中性；minIv null→—
            const statusCell = v => {
                if (v.minIv == null) return '<span class="vol-na">—</span>';
                if (v.quiet) return '<span class="vol-status vol-quiet">变安静?</span>';
                if (typeof v.rv === 'number' && v.rv >= v.minIv) return '<span class="vol-status vol-hot">够热</span>';
                return '<span class="vol-status vol-low">偏低</span>';
            };

            // 趋势：rv10 vs rv（升温↑ / 降温↓ / 持平→，0.02 绝对带算持平）
            const FLAT = 0.02;
            const trendCell = v => {
                if (typeof v.rv10 !== 'number' || typeof v.rv !== 'number') return '<span class="vol-trend-flat">—</span>';
                const d = v.rv10 - v.rv;
                if (d > FLAT) return '<span class="vol-trend-up">↑ 升温</span>';
                if (d < -FLAT) return '<span class="vol-trend-down">↓ 降温</span>';
                return '<span class="vol-trend-flat">→ 持平</span>';
            };

            body.innerHTML = `
                <div class="idle-table-wrap">
                <table class="idle-table">
                    <thead>
                        <tr>
                            <th>标的</th>
                            <th>年化 RV</th>
                            <th>趋势</th>
                            <th>Tier</th>
                            <th>IV 底</th>
                            <th>状态</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${entries.map(([ticker, v]) => `
                            <tr>
                                <td class="ticker-cell">${ticker}</td>
                                <td>${pct(v.rv)}</td>
                                <td>${trendCell(v)}</td>
                                <td>${v.tier || '—'}</td>
                                <td>${v.minIv != null ? pct(v.minIv) : '—'}</td>
                                <td>${statusCell(v)}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
                </div>
            `;
        }

        // 到期预结算：依 fetch job 的 ET 收盘日 priceLatestDate，对临期在途仓做 ITM/OTM 大概率预判。
        // 这是 weekly-close 的草稿、不是最终结算——临界(pin)与盘后波动可能翻转，OTM 一线之隔仍可能被 assign；
        // 判定用严格不等号（close==strike 归 pin，不硬判一边）。台账仍是唯一 source of truth，此处只呈现、绝不改台账。
        // priceLatestDate 缺失（旧格式 market_data）或无临期批次 → 整段隐藏（degrade），不与常规「在途持仓」列表重复。
        function renderPreSettlement(open, asOf, stale, missing) {
            const section = document.getElementById('presettle-section');
            const body = document.getElementById('presettle-body');

            // degrade：无「截至日」→ 整段隐藏（不拿客户端 new Date() 猜到期，避免 viewer 时区偏移）
            if (typeof asOf !== 'string' || !Array.isArray(open) || open.length === 0) {
                section.style.display = 'none';
                return;
            }

            // 临期筛选：已到期（expiry <= asOf）或本周内到期（dte <= 7）。日期均为 YYYY-MM-DD，字符串比较即时序比较。
            const imminent = open
                .filter(p => {
                    if (!p.expiry) return false;
                    if (p.expiry <= asOf) return true;                 // 已到期/当日到期
                    const dte = daysBetween(asOf, p.expiry);
                    return dte != null && dte <= 7;                    // 本周内到期
                })
                .sort((a, b) => a.expiry.localeCompare(b.expiry));     // 到期升序（filter 已返回新数组，不改 open）

            if (imminent.length === 0) {
                section.style.display = 'none';
                return;
            }
            section.style.display = '';

            const staleSet = new Set(Array.isArray(stale) ? stale : []);
            const missingSet = new Set(Array.isArray(missing) ? missing : []);

            // 判定 + 预计动作（与台账 lifecycle 标签对齐；着色沿用交易记录 lifecycle 语义色）：
            // CSP close<strike→ITM 接货(accent) / close>strike→OTM 归零(positive)；
            // CC  close>strike→ITM 被 call away(warning) / close<strike→OTM 归零(positive)；
            // close==strike→临界(pin, muted)；无 lastPrice→无价(muted)。
            const verdictOf = (p) => {
                if (typeof p.lastPrice !== 'number') return { badge: '无价', action: '待定', tone: 'muted', bucket: 'noprice' };
                const close = p.lastPrice, strike = p.strike;
                if (close === strike) return { badge: '临界(pin)', action: '待定', tone: 'muted', bucket: 'pin' };
                if (p.type === 'CSP') {
                    return close < strike
                        ? { badge: 'ITM', action: '接货', tone: 'accent', bucket: 'receive' }
                        : { badge: 'OTM', action: '归零保留', tone: 'positive', bucket: 'zero' };
                }
                return close > strike
                    ? { badge: 'ITM', action: '被 call away', tone: 'warning', bucket: 'callaway' }
                    : { badge: 'OTM', action: '归零保留', tone: 'positive', bucket: 'zero' };
            };

            const counts = { zero: 0, receive: 0, callaway: 0, pin: 0, noprice: 0 };
            const overdue = [];
            const rows = imminent.map(p => {
                const v = verdictOf(p);
                counts[v.bucket]++;
                if (p.expiry < asOf) overdue.push(p.ticker);           // 严格早于截至日 = 关账逾期

                // 价格滞后/缺失 → 判定存疑（不拿旧价当准）
                let doubtHtml = '';
                if (missingSet.has(p.ticker)) doubtHtml = '<div class="presettle-doubt">价格缺失，判定存疑</div>';
                else if (staleSet.has(p.ticker)) doubtHtml = '<div class="presettle-doubt">价格滞后，判定存疑</div>';

                const closeCell = typeof p.lastPrice === 'number' ? `$${p.lastPrice.toFixed(2)}` : '—';
                // 状态：expiry<=asOf → 已到期待关账（醒目、要行动）；否则 预测·收盘价（尚可变动）
                const statusHtml = p.expiry <= asOf
                    ? '<span class="trade-status trade-status-danger">已到期 · 待关账</span>'
                    : '<span class="trade-status trade-status-muted">预测 · 收盘价</span>';

                return `
                    <tr>
                        <td>${formatExpiryMd(p.expiry)}</td>
                        <td class="ticker-cell">${p.ticker}</td>
                        <td>${p.type}</td>
                        <td>$${p.strike}</td>
                        <td>${closeCell}</td>
                        <td><span class="trade-status trade-status-${v.tone}">${v.badge}</span>${doubtHtml}</td>
                        <td>${v.action}</td>
                        <td>${statusHtml}</td>
                    </tr>
                `;
            });

            // 汇总（只列非零项）：本批 N 张：X 归零 / Y 接货 / Z call away / W pin / V 无价
            const summaryParts = [
                [counts.zero, '归零'],
                [counts.receive, '接货'],
                [counts.callaway, 'call away'],
                [counts.pin, 'pin'],
                [counts.noprice, '无价'],
            ].filter(([n]) => n > 0).map(([n, label]) => `${n} ${label}`);
            const summaryHtml = `<div class="presettle-summary">本批 ${imminent.length} 张：${summaryParts.join(' / ')}</div>`;

            // 关账逾期警示（expiry < asOf；weekly-close 未做的数据卫生信号）——复用告警条 danger 样式
            let overdueHtml = '';
            if (overdue.length) {
                const list = [...new Set(overdue)].join('、');
                overdueHtml = `<div class="attention-row attention-danger presettle-overdue"><span class="att-icon">⚠</span><span>关账逾期：${list} 已过到期日，请尽快 weekly-close 入账</span></div>`;
            }

            body.innerHTML = `
                ${overdueHtml}
                ${summaryHtml}
                <div class="idle-table-wrap">
                <table class="idle-table">
                    <thead>
                        <tr>
                            <th>到期</th>
                            <th>标的</th>
                            <th>类型</th>
                            <th>Strike</th>
                            <th>收盘</th>
                            <th>判定</th>
                            <th>预计动作</th>
                            <th>状态</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${rows.join('')}
                    </tbody>
                </table>
                </div>
            `;
        }

        // ── Render ────────────────────────────────────────────────────────────

        function renderDashboard(data) {
            // Updated at
            if (data.updatedAt) {
                document.getElementById('updated-at').textContent = `更新于 ${data.updatedAt}`;
            }

            const open = data.openPositions || [];
            const idle = data.idlePositions || [];
            const closed = data.closedTrades || [];
            const weekly = data.weeklyData || [];

            const totalRealized = closed.filter(t => !/待到期/.test(t.result || '')).reduce((s, t) => s + (t.premium || 0), 0);
            const realizedCount = closed.filter(t => !/待到期/.test(t.result || '')).length;
            const pendingPremium = open.reduce((s, p) => s + (p.premium || 0), 0);
            const ccCount = open.filter(p => p.type === 'CC').length;
            const cspCount = open.filter(p => p.type === 'CSP').length;
            const cspNotionalByTicker = {};
            for (const p of open) {
                const notional = getCspNotional(p);
                if (!notional) continue;
                cspNotionalByTicker[p.ticker] = (cspNotionalByTicker[p.ticker] || 0) + notional;
            }
            const cspNotional = Object.values(cspNotionalByTicker).reduce((s, value) => s + value, 0);
            const topCspNotional = Object.entries(cspNotionalByTicker)
                .sort((a, b) => b[1] - a[1])[0];
            const topCspSub = topCspNotional
                ? `最大单标的 ${topCspNotional[0]} ${Math.round(topCspNotional[1] / cspNotional * 100)}%`
                : '暂无 CSP 敞口';

            // Stats
            document.getElementById('stats').innerHTML = `
                <div class="stat-card">
                    <div class="label">累计已实现</div>
                    <div class="value green">$${totalRealized.toLocaleString()}</div>
                    <div class="sub">${realizedCount} 笔交易</div>
                </div>
                <div class="stat-card">
                    <div class="label">在途权利金</div>
                    <div class="value yellow">$${pendingPremium.toLocaleString()}</div>
                    <div class="sub">${open.length} 张待确认</div>
                </div>
                <div class="stat-card">
                    <div class="label">在途持仓</div>
                    <div class="value cyan">${open.length}</div>
                    <div class="sub">${ccCount} CC · ${cspCount} CSP</div>
                </div>
                <div class="stat-card">
                    <div class="label">CSP 名义敞口</div>
                    <div class="value yellow">${formatDollar(cspNotional)}</div>
                    <div class="sub">${topCspSub}</div>
                </div>
            `;

            // Attention strip（履约风险分档 + 抓取自检原因）
            renderAttentionStrip(open, data.priceMissing, data.priceStale);

            // 到期预结算（临期 ITM/OTM 预判，weekly-close 草稿；priceLatestDate 缺失或无临期批次则整段隐藏）
            renderPreSettlement(open, data.priceLatestDate, data.priceStale, data.priceMissing);

            // CC 成本线锚：按 ticker 弱关联到持仓股票的接货成本。
            // 这是按 ticker 的弱关联，不是数据契约——股票不在 idle 表则无锚，跳过标记。
            const costBasisByTicker = {};
            for (const p of idle) {
                if (typeof p.costBasis === 'number') costBasisByTicker[p.ticker] = p.costBasis;
            }

            // Open positions
            const openEl = document.getElementById('open-positions');
            if (open.length === 0) {
                openEl.innerHTML = '<div class="empty-note">暂无在途期权持仓</div>';
            } else {
                // 收盘价更新时间戳
                if (data.marketDataAt) {
                    const d = new Date(data.marketDataAt);
                    const ts = d.toLocaleDateString('zh-CN', { timeZone: 'Asia/Shanghai', month: 'numeric', day: 'numeric' })
                             + ' ' + d.toLocaleTimeString('zh-CN', { timeZone: 'Asia/Shanghai', hour: '2-digit', minute: '2-digit' });
                    openEl.insertAdjacentHTML('beforebegin', `<div class="market-data-ts">收盘价更新于 ${ts}</div>`);
                }
                const renderPositionCard = (p) => {
                    const today = new Date();
                    today.setHours(0, 0, 0, 0);
                    const expDate = new Date(p.expiry + 'T23:59:59');
                    const dte = Number.isNaN(expDate.getTime()) ? null : Math.ceil((expDate - today) / 86400000);
                    const dteClass = dte != null && dte <= 2 ? 'dte-hot' : dte != null && dte <= 7 ? 'dte-warm' : '';
                    const dteLabel = dte == null ? '日期异常' : dte <= 0 ? '已到期' : `${dte} DTE`;

                    // Buffer 行（仅在有价格数据时渲染）
                    let bufferHtml = '';
                    if (p.lastPrice !== undefined && p.bufferPct !== undefined) {
                        const bufClass = p.bufferPct > 5 ? 'buffer-safe' : p.bufferPct > 0 ? 'buffer-warn' : 'buffer-danger';
                        const barColor = p.bufferPct > 5 ? '#3fb950' : p.bufferPct > 0 ? '#d29922' : '#f85149';
                        // 0-10% buffer 映射到 0-100% 宽度
                        const barWidth = Math.max(0, Math.min(100, p.bufferPct * 10));
                        const sign = p.bufferPct >= 0 ? '+' : '';
                        const itm = p.bufferPct < 0 ? ' ITM' : ' OTM';
                        bufferHtml = `
                            <div class="pos-price-row">
                                <span>收盘 $${p.lastPrice.toFixed(2)}</span>
                                <span class="${bufClass}">${sign}${p.bufferPct.toFixed(1)}%${itm}</span>
                                <div class="buffer-bar"><div class="buffer-bar-fill" style="width:${barWidth}%;background:${barColor};"></div></div>
                            </div>
                            ${renderBufferTrajectory(p.bufferHistory)}`;
                    }

                    const cspNotionalHtml = p.type === 'CSP'
                        ? `<span>占用 ${formatDollar(getCspNotional(p))}</span>`
                        : '';

                    // 年化收益率（原始期限口径）
                    const annual = getAnnualizedYieldPct(p, costBasisByTicker);
                    const annualHtml = annual != null
                        ? `<span class="pos-annual">年化 ${Math.round(annual)}%</span>`
                        : '';

                    // CC 成本线标记（Wheel-v1 §10）：修复 / T3 深度告警
                    let ccFlagHtml = '';
                    if (p.type === 'CC') {
                        const cost = costBasisByTicker[p.ticker];
                        if (typeof cost === 'number' && cost > 0) {
                            if (p.strike < cost * 0.80) {
                                const locked = (cost - p.strike) * 100 * getContractCount(p);
                                ccFlagHtml = `<span class="cc-flag cc-flag-t3">T3 · 锁亏 ${formatDollar(locked)}</span>`;
                            } else if (p.strike < cost) {
                                ccFlagHtml = `<span class="cc-flag cc-flag-repair">修复</span>`;
                            }
                        }
                    }

                    return `
                        <div class="pos-card ${p.type}">
                            <div class="pos-header">
                                <div>
                                    <span class="pos-ticker">${p.ticker}</span>
                                    <span class="pos-badge ${p.type}">${p.type}</span>
                                    <span style="font-size:14px; color:#6e7681; margin-left:6px;">$${p.strike}</span>
                                    ${ccFlagHtml}
                                </div>
                                <span class="pos-premium">${p.premium > 0 ? '+$' + p.premium : '—'}</span>
                            </div>
                            <div class="pos-meta">
                                <span>到期 ${p.expiry}</span>
                                <span class="${dteClass}">${dteLabel}</span>
                                ${p.contracts ? `<span>${p.contracts} 张</span>` : ''}
                                ${cspNotionalHtml}
                                ${annualHtml}
                            </div>
                            ${bufferHtml}
                        </div>
                    `;
                };

                const byExpiry = {};
                for (const position of open) {
                    const expiry = position.expiry || '日期异常';
                    if (!byExpiry[expiry]) byExpiry[expiry] = [];
                    byExpiry[expiry].push(position);
                }

                openEl.innerHTML = Object.entries(byExpiry)
                    .sort(([a], [b]) => a.localeCompare(b))
                    .map(([expiry, positions]) => {
                        const contracts = positions.reduce((s, p) => s + getContractCount(p), 0);
                        const groupPremium = positions.reduce((s, p) => s + (p.premium || 0), 0);
                        const groupCspNotional = positions.reduce((s, p) => s + getCspNotional(p), 0);
                        const exposureHtml = groupCspNotional > 0
                            ? `<span><strong>CSP 敞口 ${formatDollar(groupCspNotional)}</strong></span>`
                            : '';

                        return `
                            <div class="expiry-group">
                                <div class="expiry-group-header">
                                    <span class="expiry-group-title">${formatExpiryMd(expiry)} 到期</span>
                                    <span class="expiry-group-meta">
                                        <span>${contracts} 张</span>
                                        <span>权利金 ${formatDollar(groupPremium)}</span>
                                        ${exposureHtml}
                                    </span>
                                </div>
                                ${positions.map(renderPositionCard).join('')}
                            </div>
                        `;
                    }).join('');
            }

            // Idle positions
            const idleSection = document.getElementById('idle-section');
            const idleEl = document.getElementById('idle-positions');
            if (idle.length === 0) {
                idleSection.style.display = 'none';
            } else {
                idleEl.innerHTML = `
                    <div class="idle-table-wrap">
                    <table class="idle-table">
                        <thead>
                            <tr>
                                <th>标的</th>
                                <th>股数</th>
                                <th>成本均价</th>
                                <th>现价</th>
                                <th>市值成本</th>
                                <th>浮盈</th>
                                <th>可卖 CC</th>
                                <th>备注</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${idle.map(p => {
                                const priceCell = typeof p.lastPrice === 'number' ? `$${p.lastPrice.toFixed(2)}` : '—';
                                let pnlCell = '—';
                                if (typeof p.unrealizedDollar === 'number' && typeof p.unrealizedPct === 'number') {
                                    const cls = p.unrealizedDollar >= 0 ? 'pnl-pos' : 'pnl-neg';
                                    const sign = p.unrealizedDollar >= 0 ? '+' : '';
                                    pnlCell = `<span class="${cls}">${sign}$${Math.round(p.unrealizedDollar).toLocaleString()} (${sign}${p.unrealizedPct.toFixed(1)}%)</span>`;
                                }
                                return `
                                <tr>
                                    <td class="ticker-cell">${p.ticker}</td>
                                    <td>${p.shares}</td>
                                    <td>$${p.costBasis.toFixed(2)}</td>
                                    <td>${priceCell}</td>
                                    <td>$${(p.shares * p.costBasis).toLocaleString(undefined, { maximumFractionDigits: 0 })}</td>
                                    <td>${pnlCell}</td>
                                    <td>${p.canSellCC ? '<span class="cc-yes">✓ 可卖</span>' : '<span class="cc-no">–</span>'}</td>
                                    <td style="color:#6e7681; font-size:12px;">${p.note || ''}</td>
                                </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                    </div>
                `;
            }

            // Volatility health check（RV vs IV 底；volCheck 缺失则整段隐藏）
            renderVolCheck(data.volCheck);

            // Weekly chart
            const TARGET = 1000;
            const labels = weekly.map(w => w.label.replace(' 到期周', ''));
            const values = weekly.map(w => w.pending ? (w.pendingPremium || 0) : w.realized);
            const colors = weekly.map((w, i) => w.pending ? 'rgba(210,153,34,0.55)' : (values[i] >= TARGET ? 'rgba(63,185,80,0.75)' : 'rgba(57,210,192,0.65)'));
            const borders = weekly.map((w, i) => w.pending ? '#d29922' : (values[i] >= TARGET ? '#3fb950' : '#39d2c0'));

            new Chart(document.getElementById('weekly-chart').getContext('2d'), {
                type: 'bar',
                data: {
                    labels,
                    datasets: [{
                        label: '权利金',
                        data: values,
                        backgroundColor: colors,
                        borderColor: borders,
                        borderWidth: 2,
                        borderRadius: 5,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: ctx => {
                                    const w = weekly[ctx.dataIndex];
                                    return `$${ctx.parsed.y.toLocaleString()} · ${w.trades} 笔${w.pending ? ' · 待确认' : ''}`;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: '#1e2733' },
                            ticks: { color: '#6e7681', callback: v => '$' + v }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#6e7681' }
                        }
                    }
                },
                plugins: [{
                    id: 'targetLine',
                    afterDatasetsDraw(chart) {
                        const { ctx, scales: { y }, chartArea } = chart;
                        const yPx = y.getPixelForValue(TARGET);
                        ctx.save();
                        ctx.strokeStyle = 'rgba(88,166,255,0.35)';
                        ctx.lineWidth = 2;
                        ctx.setLineDash([6, 4]);
                        ctx.beginPath();
                        ctx.moveTo(chartArea.left, yPx);
                        ctx.lineTo(chartArea.right, yPx);
                        ctx.stroke();
                        ctx.restore();
                    }
                }]
            });

            // Trade history — group by expiryWeek, newest first
            const byWeek = {};
            for (const t of closed) {
                const w = t.expiryWeek;
                if (!byWeek[w]) byWeek[w] = [];
                byWeek[w].push(t);
            }

            const sortedWeeks = Object.keys(byWeek).sort((a, b) => {
                const toNum = w => { const [m, d] = w.split('/').map(Number); return m * 100 + d; };
                return toNum(b) - toNum(a); // newest first
            });

            const histEl = document.getElementById('trade-history');
            histEl.innerHTML = sortedWeeks.map((week, idx) => {
                const trades = byWeek[week];
                const total = trades.reduce((s, t) => s + t.premium, 0);
                const id = `w${idx}`;
                const negClass = total < 0 ? ' negative' : '';
                const sign = total >= 0 ? '+' : '';
                return `
                    <div class="week-group">
                        <div class="week-header" onclick="toggleWeek('${id}')">
                            <div class="week-left">
                                <span class="week-arrow" id="${id}-arrow">▶</span>
                                <span class="week-title">${week} 到期周</span>
                                <span class="week-count">${trades.length} 笔</span>
                            </div>
                            <span class="week-total${negClass}">${sign}$${Math.abs(total).toLocaleString()}</span>
                        </div>
                        <div class="week-trades" id="${id}">
                            ${trades.map(t => {
                                const sign = t.premium >= 0 ? '+' : '';
                                const color = t.premium < 0 ? '#f85149' : '#3fb950';
                                const lifecycleBadge = getLifecycleBadge(t);
                                return `
                                    <div class="trade-row">
                                        <div class="trade-left">
                                            <span class="trade-ticker">${t.ticker} <span style="color:#6e7681;font-weight:400;">${t.type} $${t.strike}</span>${lifecycleBadge}</span>
                                            <span class="trade-detail">${t.result || ''}</span>
                                        </div>
                                        <span class="trade-premium" style="color:${color}">${sign}$${Math.abs(t.premium)}</span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }).join('');

            // Auto-expand the most recent week
            if (sortedWeeks.length > 0) toggleWeek('w0');
        }

        function toggleWeek(id) {
            document.getElementById(id).classList.toggle('open');
            document.getElementById(id + '-arrow').classList.toggle('open');
        }
    </script>
</body>
</html>

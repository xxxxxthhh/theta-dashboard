name: Build & Deploy Dashboard

on:
  repository_dispatch:
    types: [data-updated]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'src/**'
      - 'template.html'
      - 'tests/**'

concurrency:
  group: dashboard-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Checkout theta-data
        uses: actions/checkout@v4
        with:
          repository: xxxxxthhh/theta-data
          token: ${{ secrets.GH_PAT }}
          path: theta-data

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test dashboard data contract
        run: node --test ./tests/*.test.js

      - name: Build dashboard
        run: node src/build.js
        env:
          THETA_DATA_DIR: theta-data
          DASHBOARD_PASS: ${{ secrets.DASHBOARD_PASS }}

      - name: Commit and push index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Re-anchor on the live tip of main before each push. actions/checkout
          # pins github.sha at *dispatch* time, so a second near-simultaneous
          # trigger would otherwise commit onto a stale base and be rejected with
          # "fetch first" — concurrency serializes the runs but does not refresh
          # that base. Reapply the freshly built index.html onto origin/main and
          # retry if main moved underneath us.
          built="$RUNNER_TEMP/index.html.built"
          cp index.html "$built"
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard FETCH_HEAD
            cp "$built" index.html
            git add index.html
            if git diff --cached --quiet; then
              echo "No changes to deploy"
              exit 0
            fi
            git commit --quiet -m "build: update dashboard $(date '+%Y-%m-%d')"
            if git push origin HEAD:main; then
              echo "Deployed on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt) — main moved; re-anchoring on latest tip"
          done
          echo "Failed to push index.html after 5 attempts" >&2
          exit 1
